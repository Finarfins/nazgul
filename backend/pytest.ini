[pytest]
addopts = --strict-markers -p no:ddtrace -m "not docker_imaj"
asyncio_mode = auto
filterwarnings =
    error::DeprecationWarning:app\..*
markers =
    postgresql: requires a real PostgreSQL server
    e2e: browser or full-stack end-to-end test
    asyncio: mark a coroutine test to run on an event loop (pytest-asyncio)
    docker_imaj: imaj kuran kapi testi; backend-quality shard'larinda
        secim disi, container job'inda -m docker_imaj ile geri secilir
