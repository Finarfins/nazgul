[pytest]
addopts = --strict-markers -p no:ddtrace
asyncio_mode = auto
filterwarnings =
    error::DeprecationWarning:app\..*
markers =
    postgresql: requires a real PostgreSQL server
    e2e: browser or full-stack end-to-end test
    asyncio: mark a coroutine test to run on an event loop (pytest-asyncio)
