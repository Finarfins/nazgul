name: CI

# Cost-control triggers:
# - Feature branches run CI only once a PR is open (via pull_request), never on
#   every intermediate push. Direct pushes to the integration branches still run.
# - concurrency cancels superseded runs so a burst of pushes bills only the last.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # Manual "Run workflow" fallback for when GitHub's automatic dispatch is
  # degraded and CI cannot be triggered via push/pull_request.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Göç zincirini BİRLEŞME SONUCU üzerinde denetler — dalın kendisinde değil.
  #
  # Ölçülmüş kusur (#56 + #60, 2026-08-12): iki dal aynı revision id'sini
  # (20260812_0056) ilan etti. Tek başına her dalda tek id ve tek baş olduğu
  # için ikisi de CI'dan yeşil geçti; çakışma yalnız BİRLEŞMEDE görünür ve
  # birleşme sonucunu hiçbir kapı denetlemiyordu.
  #
  # `pull_request` olayında checkout zaten merge commit'ini verir; ama buna
  # ÖRTÜK güvenmek tam da bu kusurun tekrarı olurdu. Aşağıdaki adım base'i
  # çekip AÇIKÇA birleştiriyor ve hangi ağacı ölçtüğünü yazdırıyor.
  #
  # Kapı DÜZELTİCİ DEĞİL: çakışan id'leri ve başları raporlar, hiçbir şeyi
  # yeniden numaralandırmaz.
  alembic-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Birleşme sonucunu AÇIKÇA kur
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.email ci@example.invalid
          git config user.name CI
          git fetch --no-tags origin "$BASE_REF" "$HEAD_SHA"
          git checkout --detach "origin/$BASE_REF"
          echo "base  origin/$BASE_REF = $(git rev-parse HEAD)"
          echo "head  $HEAD_SHA"
          # METİNSEL ÇAKIŞMA BU İŞİ DÜŞÜRÜR. Otomatik çözüm YOK.
          #
          # Eskiden çakışmada ``-X theirs`` ile yeniden deneniyordu. Bu, ölçülen
          # ağacı BİRLEŞME SONUCU olmaktan çıkarıyordu ve kapı kendi
          # sözleşmesini çiğniyordu. İki yönde de ölçüldü:
          #   * göç dosya adında add/add çakışmasında ``-X theirs`` head'in
          #     dosyasını tutup BASE'inkini DÜŞÜRÜYOR; kapı sonra tek başlı,
          #     tek id'li ama birleşme sonucu OLMAYAN bir ağacı onaylıyor.
          #   * kapı dosyalarının kendisinde içerik çakışmasında head'in kapı
          #     sürümü base'inkinin yerine geçiyor ve kapı KENDİNİ onaylıyor.
          # Yol izni listesi de çare değil: bu noktada beyaz liste yapısı
          # gereği fail-open'dır — aynı hatanın yeni yeri olur.
          #
          # Sonuç: bayat bir PR bu işte KIRMIZI olur. Doğru sinyal budur;
          # çaresi zaten kullandığımız kural — develop'ı dala MERGE etmek.
          if ! git merge --no-edit --no-ff "$HEAD_SHA"; then
            cakisan="$(git diff --name-only --diff-filter=U || true)"
            git merge --abort || true
            {
              echo "::error::Birleşme sonucu KURULAMADI: metinsel çakışma var."
              echo "Bu bir MERGE-RESULT hatasıdır; kapı otomatik çözüm YAPMAZ."
              echo "Çakışan yollar:"
              echo "$cakisan" | sed 's/^/  /'
              echo "Çare: develop'ı bu dala merge edip çakışmayı ELDE çözün."
            } >&2
            exit 1
          fi
          echo "birleşme sonucu = $(git rev-parse HEAD)"
      - name: Ölçülen ağacı bildir
        run: |
          echo "değerlendirilen ağaç: $(git rev-parse HEAD)"
          echo "göç dosyası sayısı : $(ls backend/alembic/versions/*.py | grep -vc __init__ || true)"
      # DEĞİŞMEZ KAPISI — TEK araçtan. Zinciri ayrıştıran ikinci bir kod
      # yolu YOK: `scripts/goc_zinciri.py` üç değişmezi (TEK BAŞ, HEPSİ
      # ERİŞİLEBİLİR, SAYIM TUTUYOR) kendi içinde ZORLAR ve ihlalde 1 döner.
      # Bu adım aracı SÜREÇ olarak koşturur; aşağıdaki pytest adımı aynı
      # aracın kendi kapılarını koşturur. Araç "başarıyla koştum" demekle
      # yetinmez — üç satırı da yazdırır ve `--kontrol` çıkışı okunur.
      - name: Göç zinciri değişmezleri
        run: python scripts/goc_zinciri.py --kontrol
      - name: Tek baş ve çakışmayan revision id
        working-directory: backend
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest tests/test_alembic_chain_integrity.py tests/test_goc_zinciri.py -q

  # BAYAT SIRA kapısı. `alembic-chain` ile AYNI sebeple açık birleşme kurar:
  # kusur yalnız base ile head'in BİRLEŞİMİNDE vardır. Girdi dosyasının sırası
  # dalın KENDİ ağacından hesaplanır; dal bayatladığında o sıra sessizce
  # geride kalır ve kayıt "hangi iş ne zaman indi" demeyi bırakır. Dal-yerel
  # hiçbir test bunu YAPISAL olarak göremez.
  #
  # Kapı DÜZELTİCİ DEĞİL: hiçbir dosyayı yeniden adlandırmaz, yalnız bildirir.
  #
  # >>> DEKLARE EDİLMİŞ SINIR (durum-kaydi) >>>
  # Bu kapının NE ölçtüğü ve NE ölçmediği. Kullanım belgesi değil: burayı
  # okuyan, kapının kaçırdığını bilmesi gereken kişidir. Aşağıdakilerin
  # tamamı BU İŞ ÜZERİNDE ölçülmüştür; hiçbiri başka bir kapıdan devralınarak
  # yazılmamıştır.
  #
  # ÖLÇER:
  #   * pull_request'te base'i ve head'i çalıştırma başında origin'den KENDİ
  #     çeker, birleşmeyi --no-ff ile KENDİ kurar ve ölçtüğü ağacın sha'sını
  #     yazdırır. Metinsel çakışma bu işi DÜŞÜRÜR; otomatik çözüm yoktur.
  #   * Birleşme sonucunda base'e göre EKLENEN her girdinin sırasını: base'in
  #     en büyüğünün altındaysa BAYAT (kırmızı), üstünde boşluk bırakıyorsa
  #     ATLAMIŞ (kırmızı), en büyüğe eşit ya da boşluksuz üstündeyse meşru.
  #
  # ÖLÇMEZ:
  #   * Girdinin METNİNİ. Sıra ve pr yalnız dosya ADINDADIR; yeni bir girdinin
  #     metni bu kapının konusu değildir. sha256 çapası yalnız göçle taşınan
  #     30 girdiyi kilitler ve bu bilinçlidir — çapayı her girdide oynatmak,
  #     kaldırılan paylaşılan-çapa çakışmasını testin içine geri taşırdı.
  #   * Girdinin DOĞRU olup olmadığını; yazılan işin gerçekten indiğini.
  #   * push olayında (develop) bayat sıra denetimini: karşılaştırılacak bir
  #     base yoktur, yalnız biçim kapıları koşar.
  #
  # DEVRALINMAYAN SINIR — ölçüldü, GEÇERLİ DEĞİL:
  #   * "Runner aynası bayat olabilir" sınırı BU İŞ İÇİN YOKTUR. İş, base'i
  #     runner'ın hazır kopyasından okumaz; çalıştırma başında
  #     `git fetch --no-tags origin "$BASE_REF"` ile çeker ve çektiği sha'yı
  #     `base  origin/<ref> = ...` satırında yazdırır. Ölçüm: 31961169291
  #     numaralı koşuda bu satır 9fb79fcb yazdı ve o an develop'ın başı
  #     buydu. Var olmayan bir sınırı devralmak, okuyana yanlış bir şey
  #     öğretir; bu yüzden burada yazılmamaktadır.
  #   * GERÇEKTEN KALAN pay: develop, bu fetch ile PR'ın gerçekten indiği an
  #     arasında oynayabilir. Bu saniyeler-dakikalar mertebesinde bir yarıştır
  #     ve kapıyla değil, USULLE kapatılır: merge anında base yeniden
  #     doğrulanır (checkout log'undaki "Merge <head> into <base>" satırı).
  #     Yani kapı kör değildir; kapsamı çalıştırma anıyla sınırlıdır.
  #
  # ETİKET DÜRÜSTLÜĞÜ — ölçüldü ve DÜZELTİLDİ:
  #   * head zaten base'in içindeyse git "Already up to date." der ve HEAD
  #     kıpırdamaz. Bu iş eskiden o durumda da "birleşme sonucu = <base>"
  #     yazıyordu; kapının sonucu doğruydu (eklenen girdi yok → yeşil), ama
  #     etiket ölçülmemiş bir birleşmeyi ölçülmüş gibi gösteriyordu. Artık
  #     "birleşme YAPILMADI: head zaten base'in içinde" yazar.
  # <<< DEKLARE EDİLMİŞ SINIR <<<
  durum-kaydi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Birleşme sonucunu AÇIKÇA kur
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.email ci@example.invalid
          git config user.name CI
          git fetch --no-tags origin "$BASE_REF" "$HEAD_SHA"
          git checkout --detach "origin/$BASE_REF"
          echo "base  origin/$BASE_REF = $(git rev-parse HEAD)"
          echo "head  $HEAD_SHA"
          # Metinsel çakışmada otomatik çözüm YOK — `alembic-chain` ile aynı
          # gerekçe: `-X theirs` ölçülen ağacı birleşme sonucu olmaktan çıkarır.
          oncesi="$(git rev-parse HEAD)"
          if ! cikti="$(git merge --no-edit --no-ff "$HEAD_SHA" 2>&1)"; then
            echo "$cikti"
            cakisan="$(git diff --name-only --diff-filter=U || true)"
            git merge --abort || true
            {
              echo "::error::Birleşme sonucu KURULAMADI: metinsel çakışma var."
              echo "Çakışan yollar:"
              echo "$cakisan" | sed 's/^/  /'
              echo "Çare: develop'ı bu dala merge edip çakışmayı ELDE çözün."
            } >&2
            exit 1
          fi
          echo "$cikti"
          # ETİKET DÜRÜST OLMALI. head zaten base'in içindeyse git birleşme
          # YAPMAZ ("Already up to date.") ve HEAD kıpırdamaz; o ağacı
          # "birleşme sonucu" diye adlandırmak, ölçülmemiş bir şeyi ölçülmüş
          # gibi göstermek olur. Ölçüldü: bu durumda etiket base'in sha'sını
          # yazıyordu. Kapının sonucu doğruydu (eklenen girdi yok → yeşil),
          # yanlış olan etiketti.
          if [ "$(git rev-parse HEAD)" = "$oncesi" ]; then
            echo "birleşme YAPILMADI: head zaten base'in içinde; ölçülen ağaç = base = $oncesi"
          else
            echo "birleşme sonucu = $(git rev-parse HEAD)"
          fi
      - name: Ölçülen ağacı bildir
        run: |
          echo "değerlendirilen ağaç: $(git rev-parse HEAD)"
          echo "girdi sayısı        : $(ls docs/durum/*.md 2>/dev/null | wc -l)"
      # VARLIK KAPISI — yalnız PULL REQUEST yolunda.
      # PUSH yolunda çalıştırılmaz ve bu bilinçlidir: push'ta karşılaştırılacak
      # bir PR tabanı yoktur; yukarıdaki "Birleşme sonucunu AÇIKÇA kur" adımı da
      # aynı sebeple `pull_request` ile sınırlıdır. develop'a push'ta kapıyı
      # çalıştırmak, her push'u "yeni girdi eklemiyor" diye kırmızıya çevirirdi —
      # oysa develop'ın kendisi girdi eklemez, PR'lar ekler.
      - name: Girdi VARLIĞI kapısı
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # --pr ZORUNLUDUR: verilmezse kapı SIKI değil gevşek çalışır ve bir PR
        # başkasının girdisiyle kendi girdisi olmadan inebilir. Bu satırın
        # varlığı `test_durum_kaydi.py` tarafından ayrıca sınanır.
        run: python scripts/durum.py --kapi "origin/$BASE_REF" --pr "$PR_NUMBER"

      - name: Bayat sıra kapısı
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python scripts/durum.py --kapi "origin/$BASE_REF"
      - name: Kayıt biçim kapıları
        working-directory: backend
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest tests/test_durum_kaydi.py -q

  backend-quality-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app alembic run_isolated_tests.py isolated_test_reporter.py aggregate_isolated_test_reports.py
      - name: Collect canonical isolated-test manifest in one process
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python run_isolated_tests.py --timeout 180
          --collect-manifest-json canonical-test-manifest.json
      - name: Upload canonical isolated-test manifest
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-canonical-${{ github.sha }}
          path: backend/canonical-test-manifest.json
          if-no-files-found: error
          retention-days: 1

      # PR'da DEGISEN SQLite test dosyalarini bir kez TERS SIRADA kosturur.
      # Sira-bagimli test, tanim sirasinda yesil oldugu icin normal kosuda
      # gorunmez; ucuz karsi-kanit tek bir ters kosudur.
      #
      # SINIR: bu iste PostgreSQL servisi YOKTUR, bu yuzden *postgresql*.py
      # ikizleri bilerek DISARIDA birakilir. Onlarin ters-sira korumasi bu
      # adimda DEGIL, backend-postgresql isinde aranmalidir.
      #
      # checkout@v4 fetch-depth=1 ile geldigi icin taban ref'i adim icinde
      # ayrica cekiyoruz; is genelinde fetch-depth: 0 acmak butun isi
      # yavaslatirdi.
      - name: Değişen SQLite testlerini ters sırada koştur
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=200 origin "$BASE_REF"
          if ! git merge-base FETCH_HEAD HEAD >/dev/null 2>&1; then
            git fetch --no-tags --unshallow origin || true
            git fetch --no-tags origin "$BASE_REF" || true
          fi
          degisen=$(git diff --name-only FETCH_HEAD...HEAD             | grep -E '^backend/(tests/)?test_.*\.py$'             | grep -vE 'postgresql' || true)
          if [ -z "$degisen" ]; then
            echo "değişen test dosyası yok"
            exit 0
          fi
          cd backend
          basarisiz=""
          for yol in $degisen; do
            dosya="${yol#backend/}"
            if [ ! -f "$dosya" ]; then
              echo "== $dosya silinmis, atlanıyor =="
              continue
            fi
            echo "== ters sıra: $dosya =="
            mapfile -t dugum < <(python -m pytest --collect-only -q "$dosya"               | grep '::' | tac)
            if [ "${#dugum[@]}" -eq 0 ]; then
              echo "  düğüm toplanamadı, atlanıyor"
              continue
            fi
            # Tek dosyada durmuyoruz: butun degisen dosyalar kosuluyor,
            # kapi sonda kapaniyor. Ayni maliyet, tam teshis.
            if ! DATABASE_URL="sqlite:///$RUNNER_TEMP/ters-$(basename "$dosya").db" python -m pytest -q --no-header "${dugum[@]}"; then
              basarisiz="$basarisiz $dosya"
            fi
          done
          if [ -n "$basarisiz" ]; then
            echo "ters sırada düşen dosya(lar):$basarisiz"
            exit 1
          fi
          echo "değişen SQLite test dosyaları ters sırada da yeşil"

  backend-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2, 3]
    # Her shard ayrı runner'da çalışır; bir shard'ın takılması diğerlerinin
    # tanı çıktısını iptal etmez. Publish kapısı bütün matrix sonuçlarını bekler.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app alembic run_isolated_tests.py isolated_test_reporter.py aggregate_isolated_test_reports.py
      - name: Run every active backend test in isolation
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python run_isolated_tests.py --timeout 180 --workers 2
          --shard-index ${{ matrix.shard-index }} --shard-count 4
          --report-json isolated-test-report.json
      - name: Upload isolated-test shard report
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-shard-${{ matrix.shard-index }}-${{ github.sha }}
          path: backend/isolated-test-report.json
          if-no-files-found: error
          retention-days: 1

  backend-quality-aggregate:
    runs-on: ubuntu-latest
    needs: [backend-quality-canonical, backend-quality, backend-postgresql]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download canonical and shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: backend-test-*-${{ github.sha }}
          path: ${{ runner.temp }}/backend-test-manifests
      - name: Require exact PostgreSQL disjoint shard coverage
        run: >-
          python aggregate_isolated_test_reports.py
          "$RUNNER_TEMP/backend-test-manifests/backend-test-postgresql-canonical-${{ github.sha }}/postgresql-canonical-manifest.json"
          "$RUNNER_TEMP/backend-test-manifests/backend-test-postgresql-0-${{ github.sha }}/postgresql-shard-report.json"
          "$RUNNER_TEMP/backend-test-manifests/backend-test-postgresql-1-${{ github.sha }}/postgresql-shard-report.json"
          "$RUNNER_TEMP/backend-test-manifests/backend-test-postgresql-2-${{ github.sha }}/postgresql-shard-report.json"
          "$RUNNER_TEMP/backend-test-manifests/backend-test-postgresql-3-${{ github.sha }}/postgresql-shard-report.json"
          --expected-shards 4
          --aggregate-output "$RUNNER_TEMP/postgresql-test-report.json"
      - name: Require exact disjoint shard coverage
        run: >-
          python aggregate_isolated_test_reports.py
          "$RUNNER_TEMP/backend-test-manifests/backend-test-canonical-${{ github.sha }}/canonical-test-manifest.json"
          "$RUNNER_TEMP/backend-test-manifests/backend-test-shard-0-${{ github.sha }}/isolated-test-report.json"
          "$RUNNER_TEMP/backend-test-manifests/backend-test-shard-1-${{ github.sha }}/isolated-test-report.json"
          "$RUNNER_TEMP/backend-test-manifests/backend-test-shard-2-${{ github.sha }}/isolated-test-report.json"
          "$RUNNER_TEMP/backend-test-manifests/backend-test-shard-3-${{ github.sha }}/isolated-test-report.json"
          --postgresql-report "$RUNNER_TEMP/postgresql-test-report.json"
          --skip-exceptions non_twin_skip_exceptions.json
          --expected-shards 4

  # Four independent runners reuse backend-quality's deterministic modulo shard
  # selector. Every *postgresql*.py file still runs in its OWN pytest subprocess
  # against a freshly reset schema; only independent files move in parallel.
  backend-postgresql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2, 3]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yerelhesap_test
          POSTGRES_USER: yerelhesap
          POSTGRES_PASSWORD: yerelhesap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yerelhesap -d yerelhesap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      # Adımın KENDİ sınırı var ve başarısızlığı işi öldürmüyor. Gerekçe
      # ölçüldü: bu adım üç dalda altı shard'ı 30 dakika asılı bıraktı, iş
      # İPTAL oldu ve testlerin koştuğu adım ATLANDI — o head'lerde sıfır
      # PostgreSQL testi koştu ve hiçbir yerde kırmızı görünmedi. Bir kapının
      # YOKLUĞU kesinti gibi okunuyordu.
      #
      # continue-on-error KULLANILMIYOR — bilinçli. K1 kapısı onu yayın
      # bariyerindeki işlerde yasaklıyor ve haklı: bir adımın işi kırmızıya
      # çevirmeden başarısız olabilmesi publish-image'ı fail-open yapardı.
      # Bunun yerine kurulum SONUCU KAYDEDİLİYOR ve aşağıdaki AYRI adım onu
      # işin kırmızısına çeviriyor. Böylece hem kapsam sıfıra inmiyor hem
      # bariyer fail-closed kalıyor.
      - name: Install PostgreSQL backup client
        id: pg_istemci
        timeout-minutes: 5
        env:
          PG_ISTEMCI_SINIR_SN: "180"
        run: |
          if python ../.github/scripts/pg_istemci_hazirla.py; then
            echo "durum=hazir" >> "$GITHUB_OUTPUT"
          else
            echo "durum=YOK" >> "$GITHUB_OUTPUT"
          fi
      - name: Run PostgreSQL integration gates (isolated, fresh schema per file)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PG_SHARD_INDEX: ${{ matrix.shard-index }}
          PG_SHARD_COUNT: "4"
          # Hard gate, not a heuristic: conftest._require_postgresql_engine fails
          # any test in this job whose engine is not PostgreSQL, so no twin can
          # silently fall back to SQLite and pass as fake parity. backend-quality
          # leaves this unset and stays on SQLite.
          REQUIRE_PG: "1"
          PG_RESET_URL: postgresql://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          # app.config.Settings is a module-level singleton frozen at import time, so a
          # twin that only monkeypatches DATABASE_URL inside its test body arrives too
          # late and silently falls back to the local SQLite veriler.db — passing as
          # fake "PostgreSQL parity". Exporting DATABASE_URL for the whole job makes
          # every current and future twin genuinely hit PostgreSQL 16; the per-file
          # *_TEST_DATABASE_URL vars below point at the same database, so the twins
          # that monkeypatch simply re-set the identical value. backend-quality
          # deliberately does NOT set this and stays on SQLite.
          DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          APP_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          WORKFLOW_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          TRANSACTIONS_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          NUMERIC_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          WORK_ORDERS_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          WORK_ORDER_PARTS_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          WORK_ORDER_BILLING_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          ENTERPRISE_INVOICE_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          INVOICE_CANCEL_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          INVOICE_FREEZE_RACE_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          NUMERIC_BOUNDS_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          STOCK_RACE_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          INVOICE_ROLLBACK_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          CARI_PARITY_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          SUPPLIER_PRICES_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          EINVOICE_SEAM_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          ABSORPTION_RATE_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
          CONTRACT_TEST_DATABASE_URL: postgresql+psycopg://yerelhesap:yerelhesap@localhost:5432/yerelhesap_test
        run: |
          set -euo pipefail
          shopt -s nullglob
          # company_id default contract'i adinda "postgresql" gecmese de migration
          # yolunu REQUIRE_PG=1 ile gercek PostgreSQL 16 uzerinde calistirir.
          all_files=(test_*postgresql*.py tests/test_company_id_default_contract.py tests/test_ci_playwright_hazirlik.py)
          # Donmuş PostgreSQL test popülasyonu (99 postgresql-adlı + 2 özel = 101).
          # SAYIM ÖLÇÜLDÜ, aritmetikle türetilmedi. Bu yorum bir tur boyunca
          # "97 + 2 = 99" derken sabit 100'dü; değeri doğru olan ama gerekçesi
          # onu yalanlayan bir çivi sonraki okuyucu için TUZAKTIR.
          # 97 -> 98: `test_uretici_kayit_defteri_postgresql.py` (Uygulama Kayıt
          # Çizelgesi; genişleyen bind, NUMERIC ölçeği, TIMESTAMPTZ ve çapraz
          # kiracı GERÇEK PostgreSQL üzerinde ölçülüyor) — develop'a PR #22 ile indi.
          # 99 -> 100: `test_birim_donusumu_postgresql.py` (birim dönüşümü; göç
          # 20260902_0066 — çözücünün SAYISAL iddiası ve SONLU OLMAYAN girdinin
          # reddi yalnız gerçek NUMERIC(18,4) üzerinde ayırt edici).
          # 98 -> 99: `test_farm_bku_ice_aktarma_postgresql.py` (BKÜ içe aktarma;
          # "bir bozuk satır dosyayı düşürmez" kuralı SAVEPOINT'e dayanır ve
          # savepoint yokken SQLite koşusu YEŞİL kalır). Taban develop'un 98'idir,
          # sayı ÖLÇÜLDÜ. develop'un 98'i BKÜ kataloğu, tarla yazma kilitleri ve
          # Uygulama Kayıt Çizelgesi ikizlerini zaten sayıyor.
          # Alt sınır yerine tam eşitlik: dosya silinmesi veya yeniden adlandırma ile
          # sessizce test kapsamının düşmesini engeller. Yeni PG testi eklendiğinde
          # veya çıkarıldığında bu sabit bilinçli olarak güncellenmelidir.
          # 100 -> 101: `test_parti_skt_postgresql.py` (parti/SKT + FEFO; göç
          # 20260903_0067). İkiz ZORUNLU çünkü üç iddia yalnız üretim
          # diyalektinde ayırt edici: `CHECK ... quantity <> 'NaN'::numeric`in
          # NaN yarısı yalnız PostgreSQL'de vardır, dağıtım paylarının
          # NUMERIC(18,4) ölçeği SQLite'ta dayatılmaz, ve bileşik yabancı
          # anahtar SQLite'ta varsayılan olarak uygulanmaz. Taban develop'un
          # 98 glob dosyasıdır ve ÖLÇÜLDÜ (`ls backend/test_*postgresql*.py |
          # wc -l`), önceki ölçümün üzerine aritmetik yapılarak değil.
          BEKLENEN_PG_DOSYA_SAYISI=104
          if [ "${#all_files[@]}" -ne "$BEKLENEN_PG_DOSYA_SAYISI" ]; then
            echo "FAIL: tam $BEKLENEN_PG_DOSYA_SAYISI PG dosyası bekleniyor, ${#all_files[@]} bulundu" >&2
            exit 1
          fi

          selection_file="$(mktemp)"
          if ! python - "$PG_SHARD_INDEX" "$PG_SHARD_COUNT" "${all_files[@]}" \
            > "$selection_file" <<'PY'
          import sys
          from pathlib import Path

          from run_isolated_tests import select_test_shard

          shard_index = int(sys.argv[1])
          shard_count = int(sys.argv[2])
          paths = [Path(value) for value in sys.argv[3:]]
          for path in select_test_shard(
              paths,
              shard_index=shard_index,
              shard_count=shard_count,
          ):
              print(path.as_posix())
          PY
          then
            rm -f "$selection_file"
            echo "FAIL: PostgreSQL shard seçimi çalıştırılamadı" >&2
            exit 1
          fi
          mapfile -t files < "$selection_file"
          rm -f "$selection_file"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "FAIL: PostgreSQL shard $PG_SHARD_INDEX/$PG_SHARD_COUNT boş" >&2
            exit 1
          fi
          echo "Shard $PG_SHARD_INDEX/$PG_SHARD_COUNT selected ${#files[@]} of ${#all_files[@]} PostgreSQL integration files:"
          printf '  %s\n' "${files[@]}"
          reset_schema() {
            python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["PG_RESET_URL"], autocommit=True) as conn:
              conn.execute("DROP SCHEMA IF EXISTS public CASCADE")
              conn.execute("CREATE SCHEMA public")
          PY
          }
          if [ "$PG_SHARD_INDEX" -eq 0 ]; then
            canonical_raw="$RUNNER_TEMP/postgresql-canonical-raw.json"
            canonical_manifest="$RUNNER_TEMP/postgresql-canonical-manifest.json"
            reset_schema
            ISOLATED_TEST_REPORT="$canonical_raw" \
              python -m pytest --collect-only -q -p isolated_test_reporter "${all_files[@]}"
            python - "$canonical_raw" "$canonical_manifest" "${all_files[@]}" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          test_files = [Path(value) for value in sys.argv[3:]]
          payload = json.loads(raw_path.read_text(encoding="utf-8"))
          collected = payload.get("collected")
          if not isinstance(collected, list) or not collected or not all(
              isinstance(nodeid, str) and nodeid for nodeid in collected
          ):
              raise SystemExit("PostgreSQL canonical collection node listesi geçersiz")
          expected_sources = {path.as_posix() for path in test_files}
          actual_sources = {nodeid.split("::", 1)[0] for nodeid in collected}
          if actual_sources != expected_sources:
              raise SystemExit(
                  "PostgreSQL canonical collection dosya kümesi ayrıştı: "
                  f"missing={sorted(expected_sources - actual_sources)}, "
                  f"extra={sorted(actual_sources - expected_sources)}"
              )
          canonical = {
              "files": [path.with_suffix(".json").as_posix() for path in test_files],
              "nodes": collected,
          }
          output_path.write_text(
              json.dumps(canonical, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              f"PostgreSQL canonical manifest: {len(test_files)} files, "
              f"{len(collected)} nodes"
          )
          PY
          fi
          fail=0
          kosulan=0
          report_dir="$RUNNER_TEMP/postgresql-test-reports"
          mkdir -p "$report_dir"
          for f in "${files[@]}"; do
            echo "::group::$f"
            reset_schema
            if ! ISOLATED_TEST_REPORT="$report_dir/${f%.py}.json" \
              python -m pytest -q -p isolated_test_reporter "$f"; then
              echo "FAILED: $f" >&2
              fail=1
            fi
            kosulan=$((kosulan + 1))
            echo "::endgroup::"
          done
          # "HİÇBİR ŞEY KOŞMADI" kendi adıyla kırmızı olur. Kusurun tam da bu
          # hâli görünmezdi: adım atlanınca sıfır test koşuyor ve dışarıdan
          # "iptal" gibi okunuyordu.
          if [ "$kosulan" -eq 0 ]; then
            echo "FAIL: HİÇBİR PostgreSQL dosyası koşulmadı (shard $PG_SHARD_INDEX)" >&2
            exit 1
          fi
          echo "PG_KOSULAN_DOSYA=$kosulan"
          if [ "$fail" -ne 0 ]; then
            exit "$fail"
          fi
          python merge_postgresql_test_reports.py "$report_dir" \
            --output postgresql-shard-report.json
      # Kurulum başarısızlığı BURADA, kendi adıyla kırmızı olur — testlerin
      # sonucundan ayrı okunabilsin diye. Üç durum artık üç ayrı işaret:
      #   kurulum başarısız -> bu adım kırmızı, testler yine de koştu
      #   testler başarısız -> test adımı kırmızı
      #   hiçbir şey koşmadı -> test adımı "HİÇBİR PostgreSQL dosyası" ile kırmızı
      - name: PostgreSQL istemci kurulumu sonucu
        if: always() && steps.pg_istemci.outputs.durum != 'hazir'
        run: |
          echo "::error::PostgreSQL istemcisi hazırlanamadı (kayıtlı durum: ${{ steps.pg_istemci.outputs.durum }})." >&2
          echo "Bu bir ALTYAPI arızasıdır; test kapsamı sıfıra inmedi, testler koştu." >&2
          exit 1
      - name: Upload PostgreSQL shard node reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-postgresql-${{ matrix.shard-index }}-${{ github.sha }}
          path: backend/postgresql-shard-report.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload canonical PostgreSQL manifest
        if: matrix.shard-index == 0
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-postgresql-canonical-${{ github.sha }}
          path: ${{ runner.temp }}/postgresql-canonical-manifest.json
          if-no-files-found: error
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    # ÖLÇÜLDÜ (son 30 tamamlanmış CI koşusu, 2026-09-04): frontend süreleri
    # min 0m48s, medyan 6m09s, maks 12m19s. Tamamlanan (success) denemelerde
    # maks 11m51s — tavanın ~28 saniye altında. Otuz koşunun ÜÇ frontend
    # işi tam tavanda öldürüldü (33856366292, 33854225188 deneme 1,
    # 33853270963); GitHub timeout öldürmesini `failure` değil `cancelled`
    # bildirdiği için bu üç iş toplu görünümde arıza gibi DEĞİL, iptal gibi
    # görünüyordu. ~28 saniyelik pay bir bütçe değildir.
    #
    # VARYANSIN SEBEBİ ARTIK ÖLÇÜLDÜ (bu yorumun önceki hâli "ÖLÇÜLMEDİ: npm ci
    # 2-7 dk varyansı" diyordu). Baskın adım `npm ci` (0m14s–7m04s) ve İKİ AYRI
    # yavaşlama sınıfı var:
    #   (a) ÖRTÜK AUDIT ASILMASI — `npm ci`'nin kendiliğinden yaptığı audit
    #       isteği, kayıt defteri bozukken sabit bir zaman aşımı merdiveninde
    #       asılıyor. Log'dan AYIRT EDİLİR: audit koştuysa satır "added 608
    #       packages, and audited 609 packages in <süre>"; asıldıysa audit
    #       cümlesi DÜŞER ve satır "added 608 packages in 7m" olur. Paket sayısı
    #       (608) her koşuda AYNI — inen ağırlık değişmiyor, asılan şey audit.
    #       Bu sınıftaki ALTI koşu: 33856366292, 33853270963, 33846053464,
    #       33859065506, 33843671226 (hepsi "in 7m") ve 33815691003 ("in 5m").
    #       Aşağıdaki `--no-audit` bu sınıfı kaynağından kapatır.
    #   (b) YAVAŞ İNDİRME — audit BAŞARIYLA koşuyor ama indirme yine de uzun:
    #       33848969644'te `npm ci` 4m54s ve satır "added 608 packages, and
    #       audited 609 packages in 5m". `--no-audit` bu sınıfı KAPATMAZ.
    #
    # ARİTMETİK (audit sivrileri ÇIKARILARAK — 29 koşudan 6'sı çıktı, 23 kaldı):
    # kalan maks 11m15s (33848969644, success, tavanda KIRPILMAMIŞ) -> yukarı
    # yuvarla 12 dk; 12 x 1.5 = 18; 5'e yukarı yuvarla -> 20.
    # Yani sivriler çıkarılsa BİLE 12 dk yetmez (11m15s x 1.5 = 16.9 dk > 12).
    # Bütçeyi (b) sınıfı belirler ve 20'de kalır; (a) sınıfı ayrıca ve
    # bağımsız olarak kaynağından düzeltilir. İki karar, iki gerekçe.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `--no-audit`: KAPSAM KAYBI YOK, YALNIZ ASILAN İSTEK KALKAR.
      #
      # `npm ci`'nin örtük audit'i bu depoda ZATEN bir kapı DEĞİLDİ: `npm ci`
      # audit bulgusunda non-zero dönmez, yani bu çağrının çıktısı hiçbir yerde
      # okunmuyor ve hiçbir işi kırmızı yakmıyordu. Ölçülen tek etkisi süreydi
      # (yukarıdaki (a) sınıfı: "added 608 packages in 7m", audit cümlesi düşmüş).
      #
      # GERÇEK GHSA KAPISI YERİNDE DURUYOR ve bu satırdan bağımsızdır:
      #   * aşağıdaki AÇIK adım — `npm run test:audit-policy` + `npm run
      #     audit:policy -- --degrade-on-unavailable` (#34; ağ sınıfı hatada
      #     ::warning:: basıp geçer, POLİTİKA İHLALİNİ asla yutmaz),
      #   * `package-lock.json` sha256'sı `audit-allowlist.json` içinde beyan
      #     edilir ve bozulmuş geçiş yolunda DA kontrol edilir (çevrimdışı sinyal),
      #   * yaşayan GHSA kontrolü KATI hâliyle `audit-gunluk.yml` günlük iş
      #     akışında koşar.
      # Yani kaldırılan şey ölçüm değil, ölçüm YAPMAYAN bir bekleme.
      - run: npm ci --no-audit
      # ESLint'in varsayılan çıkış sözleşmesi burada bilinçli: hata varsa
      # non-zero, uyarı varsa zero. Böylece mevcut uyarıların tamamı ve toplam
      # sayısı job çıktısında görünür, fakat yalnız error seviyesi kapıyı kapatır.
      - name: Run ESLint (errors fail, warnings reported)
        run: npm run lint
      # Kapının gerçekten error seviyesini reddettiğini aynı ESLint komutuyla
      # kanıtla. Geçici dosya her durumda silinir; uyarılar --quiet ile bu
      # negatif kontrolde gizlenir, normal lint adımında görünmeye devam eder.
      - name: Prove an error-level lint mutation is rejected
        shell: bash
        run: |
          set -euo pipefail
          mutation_file="src/__lint_gate_mutation__.tsx"
          trap 'rm -f "$mutation_file"' EXIT
          printf '%s\n' \
            "export default function LintGateMutation(){" \
            "  return <p>don't pass an error</p>;" \
            "}" > "$mutation_file"

          set +e
          mutation_output="$(npm run lint -- --quiet 2>&1)"
          mutation_status=$?
          set -e
          printf '%s\n' "$mutation_output"
          if [ "$mutation_status" -ne 1 ] || \
             ! grep -q 'react/no-unescaped-entities' <<< "$mutation_output"; then
            echo "::error::Expected lint-rule rejection was not observed (exit=$mutation_status)" >&2
            exit 1
          fi
          echo "MUTATION_RED lintErrorCount: 0 -> 1"
      # frontend/e2e ARTIK HER İKİ STATİK DENETİMİN İÇİNDE.
      #
      # ÖLÇÜLEN KUSUR: bu klasör ne tsc'nin ne eslint'in kapsamındaydı.
      # `tsconfig.app.json` yalnız `src`'yi, `tsconfig.node.json` yalnız
      # `vite.config.ts`'i içeriyordu; `lint` betiği `eslint src` idi. Kapıların
      # TAMAMI (taşma kapısı, dinme kuralı, tohum yarışı) bu klasörde yaşıyor,
      # yani ölçüm yapan kodun kendisi ölçülmüyordu. Bozuk bir ölçüm, geçen bir
      # ölçüme benziyorsa bu deponun en pahalı kusur sınıfıdır.
      #
      # Kapsam artık: `npm run lint` -> `eslint src e2e`, ve `typecheck:e2e`
      # -> `tsconfig.e2e.json`. İkincisi ayrıca `tsconfig.json` referanslarında,
      # yani `tsc -b` koşan her build de kapsıyor; buradaki ADIM okunurluk için:
      # düşerse hata mesajı "build başarısız" değil, "e2e tip denetimi" der.
      - name: Type-check frontend/e2e
        run: npm run typecheck:e2e
      # KAPSAMIN KANITI — TİP YÖNÜ. Denetimin e2e'ye GERÇEKTEN ulaştığını
      # kanıtlar: bilerek bozuk bir dosya konur, `typecheck:e2e` KIRMIZI olmak
      # ZORUNDA ve beklenen TS kodunu bildirmek zorunda. Dosya her durumda
      # silinir.
      - name: Prove an e2e type error is rejected
        shell: bash
        run: |
          set -euo pipefail
          mutasyon="e2e/__kapi_mutasyonu__.ts"
          trap 'rm -f "$mutasyon"' EXIT
          printf '%s\n' "export const __tip_mutasyonu__: number = 'metin';" > "$mutasyon"
          set +e
          cikti="$(npm run typecheck:e2e 2>&1)"
          durum=$?
          set -e
          printf '%s\n' "$cikti"
          if [ "$durum" -eq 0 ] || ! grep -q 'error TS2322' <<< "$cikti"; then
            echo "::error::e2e tip denetimi bilerek bozulan dosyayı REDDETMEDİ (cikis=$durum)" >&2
            exit 1
          fi
          echo "MUTATION_RED e2eTypeErrorCount: 0 -> 1"
      # KAPSAMIN KANITI — LINT YÖNÜ, VE OVERRIDE'IN DARLIĞI.
      #
      # Kural bilerek REACT İLE İLGİSİZ seçildi (`prefer-const`). `eslint.config.js`
      # e2e için React kural kümesini kapatıyor; bu adım o override'ın YALNIZ onu
      # kapattığını kanıtlar. Fazlasını susturan bir override, bu depoda
      # reddedilen fail-open şeklinin ta kendisidir.
      - name: Prove an e2e lint error is rejected (rule unrelated to React)
        shell: bash
        run: |
          set -euo pipefail
          mutasyon="e2e/__kapi_mutasyonu__.ts"
          trap 'rm -f "$mutasyon"' EXIT
          printf '%s\n' \
            "export function __lint_mutasyonu__(): string {" \
            "  let deger = 42;" \
            "  return String(deger);" \
            "}" > "$mutasyon"
          set +e
          cikti="$(npm run lint -- --quiet 2>&1)"
          durum=$?
          set -e
          printf '%s\n' "$cikti"
          if [ "$durum" -ne 1 ] || ! grep -q 'prefer-const' <<< "$cikti"; then
            echo "::error::e2e lint kapısı bilerek bozulan dosyayı REDDETMEDİ (cikis=$durum)" >&2
            exit 1
          fi
          echo "MUTATION_RED e2eLintErrorCount: 0 -> 1"
      # E2E UYARI SAYISI DONDURULDU — YALNIZ e2e, src'ye DOKUNULMADI.
      #
      # ÖLÇÜLEN BOŞLUK: uyarılar kapıyı kapatmıyor (bilinçli sözleşme, yukarıya
      # bakınız) ve sayılarını HİÇBİR ŞEY sabitlemiyordu. Sabitlenmeyen bir sayı
      # sessizce yukarı kayar; bu, kayıt defterindeki `<merge tarihi>` yer
      # tutucusuyla aynı aşınma sınıfıdır — kimsenin yanlış yaptığı bir an yok,
      # yine de zamanla bozuluyor.
      #
      # Sayı TAM eşleşmek zorunda, sadece üst sınır değil: düşerse de kapı durur
      # ve sayının güncellenmesini ister. Böylece hem artış hem de bayat kalan
      # bir beyan bir KARAR olur. Deponun mevcut deseni budur (bkz. backend
      # test_tenant_scoping_guard.py, BEKLENEN_ALT_SUREC_SQL_METIN).
      #
      # Bugünkü 8 uyarının sınıfları: import/order (5), no-unused-vars (3).
      # src'nin uyarıları BİLEREK kapsam dışı: bu adım yalnız `e2e` klasörünü
      # sayar, `npm run lint` ise ikisini birden raporlamaya devam eder.
      - name: Freeze the frontend/e2e lint warning count
        shell: bash
        run: |
          set -euo pipefail
          BEKLENEN=8
          rapor="e2e-lint-rapor.json"
          trap 'rm -f "$rapor"' EXIT
          npx eslint e2e --format json > "$rapor" || true
          okunan="$(node -e "
            const r = require('./e2e-lint-rapor.json');
            const u = r.reduce((t, f) => t + f.warningCount, 0);
            const h = r.reduce((t, f) => t + f.errorCount, 0);
            if (h > 0) { console.error('HATA sayısı sıfır olmalı: ' + h); process.exit(2); }
            console.log(u);
          ")"
          echo "E2E_LINT_UYARI=$okunan (bildirilen $BEKLENEN)"
          if [ "$okunan" -ne "$BEKLENEN" ]; then
            echo "::error::frontend/e2e lint uyarı sayısı $okunan, bildirilen $BEKLENEN. Arttıysa yeni uyarıyı düzeltin; azaldıysa bu adımdaki BEKLENEN değerini düşürün — her iki yön de bilinçli bir karar olmalı." >&2
            exit 1
          fi
      # ZORUNLU BAGLAM UCUNCU TARAFIN AYAKTA OLMASINA BAGLANAMAZ.
      #
      # OLCULEN ARIZA: 2026-09-03 ~22:00'den beri npm kayit defteri ucu zaman
      # asimina ugruyor; develop caf4114'un kendisi (kosu 33807936220), PR #31
      # (3 yeniden kosu) ve PR #32 yalniz AUDIT_TIMEOUT yuzunden KIRMIZI yandi,
      # butun kod testleri gecerken. Bir ucuncu tarafin erisilebilirligiyle
      # dusen zorunlu baglam bir KAPI degildir: sinyal degil gurultu uretir ve
      # yesili yeniden kosarak "kazanmayi" ogretir.
      #
      # BOZULAN SEY, KAPI DEGIL, ARIZA SEKLI: betik uc kez (her biri 30 sn)
      # dener; ancak AG SINIFI bir hata sonrasi --degrade-on-unavailable ile
      # ::warning::AUDIT_UNAVAILABLE basip 0 ile ciker. Bir POLITIKA IHLALI
      # ya da bozuk yuk bu yoldan ASLA gecmez -- kanit: betigin
      # "--degrade-on-unavailable NEVER swallows a real policy violation" ve
      # "a registry outage that exits 1 ... is unavailable, not a broken
      # payload" alt-testleri.
      #
      # CEVRIMDISI SINYAL YERINDE KALIR: package-lock.json'un sha256'si
      # audit-allowlist.json icinde beyan edilir ve bu kontrol bozulmus gecis
      # yolunda DA kosar. Yani ag olmasa bile bagimlilik agacindaki her degisim
      # kapiyi kirmizi yakar. Yasayan GHSA kontrolu KATI haliyle gunluk
      # audit-gunluk.yml is akisinda kosar (zorunlu DEGIL, sesli duser).
      - name: Enforce exact frontend GHSA audit policy
        run: |
          npm run test:audit-policy
          npm run audit:policy -- --degrade-on-unavailable
      - run: npm run build:bridge
      - run: npm run build:field-pwa
      - run: npm test -- --run

  # Kontrat drift kapısı: commit edilmiş üretilenler (frontend/src/api/types.gen.ts
  # ve frontend/src/test/fixtures/pos-api.json) backend'in GERÇEK OpenAPI şeması ve
  # GERÇEK yanıt gövdelerinden yeniden üretilir; fark çıkarsa iş kırmızı yanar.
  # Prod POS çökmesi (şema=string sanılırken çalışma anı=sayı) bu kapının önlediği
  # sınıftır. Kontrat pytest'leri ayrıca backend-quality (SQLite) ve
  # backend-postgresql (PG ikizi) içinde otomatik koşar.
  contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt
      # `--no-audit`: KAPSAM KAYBI YOK — gerekçe `frontend` işindekiyle AYNI.
      - run: npm ci --no-audit
        working-directory: frontend
      - name: Regenerate OpenAPI, TS types and real-API fixtures
        run: |
          set -euo pipefail
          python backend/export_openapi.py -o backend/openapi.json
          (cd frontend && npm run types:gen)
          python backend/tools/capture_frontend_fixtures.py
      - name: Committed generated artifacts must match the backend
        run: |
          git diff --exit-code -- frontend/src/api/types.gen.ts frontend/src/test/fixtures || {
            echo "::error::Üretilen tipler/fixture'lar backend'den ayrışmış. Lokal olarak: python backend/export_openapi.py -o backend/openapi.json && (cd frontend && npm run types:gen) && python backend/tools/capture_frontend_fixtures.py" >&2
            exit 1
          }

  # Gerçek yığın E2E: uvicorn + taze SQLite + build edilmiş frontend + Chromium.
  # Her spec konsol-temiz biter (tek console.error/pageerror = kırmızı); POS
  # quick-pick akışı bugünkü prod çökmesinin birebir reprodüksiyonudur.
  e2e:
    runs-on: ubuntu-latest
    # ÖLÇÜLDÜ (son 30 CI koşusu, 2026-09-03/04): e2e süreleri min 1m24s,
    # medyan 16m31s, maks 20m19s. Tamamlanan (success) 16 koşuda maks 19m59s —
    # tavanın BİR saniye altında. Otuz koşunun BEŞİ tam tavanda öldürüldü
    # (33843671226, 33821605217, 33819153815, 33815691003, 33812273855);
    # GitHub timeout öldürmesini `failure` değil `cancelled` bildirdiği için bu
    # beş koşu toplu görünümde arıza gibi DEĞİL, iptal gibi görünüyordu.
    # ~1 dakikalık pay bir bütçe değildir.
    #
    # ARİTMETİK: gözlenen maks 20m19s tavanda kırpılmış (gerçek süre bilinmiyor,
    # >= bu), yukarı yuvarla -> 21 dk; 21 x 1.5 = 31.5; 5'e yukarı yuvarla -> 35.
    #
    # ÖLÇÜLMEDİ: e2e'nin NEDEN 19 dakika sürdüğü. Bu PR yalnız bütçeyi ölçer,
    # süreyi değil. Ayrı keşif işi (bkz. durum kaydı 0067).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt
      # `--no-audit`: KAPSAM KAYBI YOK — gerekçe `frontend` işindekiyle AYNI.
      #
      # `npm ci`'nin örtük audit'i audit bulgusunda non-zero DÖNMEZ; bu işte
      # çıktısı hiç okunmuyordu, yani kapı değildi. Ölçüldü: bu işin `npm ci`
      # adımı beş koşunun DÖRDÜNDE 5m53s–7m03s sürdü ve o dördünde log satırı
      # audit cümlesini DÜŞÜRMÜŞTÜ ("added 608 packages in 7m"); audit'in
      # başarıyla koştuğu tek koşuda (33848969644) adım 53 saniyeydi
      # ("added 608 packages, and audited 609 packages in 53s"). Paket sayısı
      # (608) beşinde de aynı.
      #
      # GERÇEK GHSA KAPISI bu işte DEĞİL, `frontend` işindeki AÇIK
      # `npm run audit:policy -- --degrade-on-unavailable` adımında ve günlük
      # `audit-gunluk.yml` akışında duruyor; ikisi de bu satırdan etkilenmez.
      - run: npm ci --no-audit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # SINIRLI ve OKUNUR hazırlık. Eski hâli sınırsızdı:
      #     npx playwright install --with-deps chromium
      # Ölçüldü (koşu 32250851322): adım 19 dk 5 sn asılı kaldı, iş İPTAL oldu,
      # testler ATLANDI — o head'de sıfır e2e testi koştu ve koşu "cancelled"
      # göründü. #82'nin apt için kapattığı kusurun aynı sınıfı; sebep de aynı,
      # `--with-deps` kök olup `apt-get update` koşturuyor.
      #
      # Betik önce BAKAR (tarayıcı önbellekte mi, dokuz font paketi kurulu mu),
      # yalnız eksik olanı KENDİ sınırıyla kurar ve sonucu üç ayrı sinyalle
      # bildirir. Sınırlar işin timeout-minutes'ından bağımsız.
      - name: Playwright hazırlığı (sınırlı)
        id: pw_hazirlik
        shell: bash
        working-directory: frontend
        env:
          PW_CALISMA_DIZINI: "."
          PW_TARAYICI_SINIR_SN: "300"
          PW_BAGIMLILIK_SINIR_SN: "300"
        # BORU YOK. `... | tee` denendi ve FAIL-OPEN çıktı: bash'te borunun
        # çıkış kodu SON komuttan gelir, `tee` 0 döner ve betiğin `exit 1`i
        # yutulur. Ölçüldü (koşu 32255512999): betik "SINIRI aştı" deyip 1
        # döndürdü, adım YEŞİL göründü, sonuç adımı atlandı ve testler yine
        # koştu. Arızayı görünür kılmak için kurulan kapı, arızayı görünmez
        # kılmıştı — düzeltilen kusurun bir katman yukarıdaki aynısı.
        run: python ../.github/scripts/playwright_hazirla.py
      # Sonuç AYRI adımda kırmızıya döner. `continue-on-error` KULLANILMIYOR:
      # K1 kapısı yayın bariyerindeki işlerde onu reddediyor ve haklı — hazırlık
      # düşerse iş kırmızı olmalı, sessizce devam etmemeli.
      - name: Playwright hazırlık sonucu
        if: always() && steps.pw_hazirlik.outcome != 'success'
        shell: bash
        run: |
          echo "::error::Playwright hazırlığı başarısız; e2e testleri KOŞMADI."
          exit 1
      # ÜRETİM VARSAYILANI: tahsis motoru KAPALI. Kullanıcıların sahip olduğu
      # yapılandırma budur ve kapı önce onu ölçer.
      - run: npx playwright test
        working-directory: frontend
      # AÇIK yapılandırma da ölçülür; aksi halde motor açıkken ortaya çıkan
      # tahsis geçmişi yüzeyi hiç sınanmamış olurdu. İki durum da ölçülmezse
      # biri diğerinin defektini gizler.
      # Proje AÇIKÇA verilir: #64 iki proje bildiriyor ve bu ölçüm İSTANBUL DIŞI
      # dilimde yapılmalı. Proje adı yazılmazsa hangi dilimde ölçüldüğü rapordan
      # okunamaz — bildirilmemiş dilim, ölçülmemiş demektir.
      - run: npx playwright test e2e/touch-targets.spec.ts --project=chromium-utc --grep "@tahsis-motoru"
        working-directory: frontend
        env:
          PAYMENT_ALLOCATION_ENGINE_ENABLED: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    # Test edilen imajın KİMLİĞİ job çıktısı olarak taşınır; verify-image-artifact
    # beklenen değeri artifact'in İÇİNDEN okumaz. Beklenti ölçülen nesnenin
    # YANINDA taşınsaydı kapı kendi kopyasına bakıyor olurdu: takas edilmiş bir
    # tarball kendi ID'sini de beraberinde getirir ve kapı yine yeşil kalırdı.
    outputs:
      tested_image_id: ${{ steps.paketle.outputs.tested_image_id }}
    steps:
      - uses: actions/checkout@v4
      # Caddyfile'daki yazım hatası / kaldırılmış / olmayan direktif prod'da
      # değil BURADA patlasın: caddy validate, Caddyfile'ı caddyfile adaptörüyle
      # ayrıştırıp modülleri provision eder, hata varsa iş kırmızı yanar.
      # Etiket docker-compose.prod.yml'deki proxy servisinden TÜRETİLİR (tek
      # kaynak), böylece CI prod'un koştuğundan başka bir Caddy sürümüyle
      # doğrulama yapamaz. APP_DOMAIN/ACME_EMAIL yalnızca {$...} yer
      # tutucularını doldurmak için; ağ isteği yapılmaz.
      - name: Validate Caddyfile with the production Caddy image
        run: |
          set -euo pipefail
          caddy_image="$(sed -n 's/^[[:space:]]*image:[[:space:]]*\(caddy:[^[:space:]#]*\).*/\1/p' docker-compose.prod.yml | head -n1)"
          if [ -z "$caddy_image" ]; then
            echo "::error::docker-compose.prod.yml içinde 'image: caddy:...' satırı bulunamadı" >&2
            exit 1
          fi
          echo "deploy/Caddyfile doğrulanıyor: $caddy_image (docker-compose.prod.yml'den türetildi)"
          # TEK ALAN ADI. MARKETING_DOMAIN ve LEGACY_DOMAIN artık Caddyfile'da
          # GEÇMİYOR; onları burada vermek, kaldırılmış bir yapılandırmayı
          # doğruluyormuş gibi görünen ölü bir senaryo üretiyordu. Kanonik düzen:
          # {$APP_DOMAIN} + www.{$APP_DOMAIN} -> apex + /srv/bakim bakım sayfası.
          docker run --rm \
            -e APP_DOMAIN=ci.example.com \
            -e ACME_EMAIL=ci@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$caddy_image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      # VITE_* değişkenlerini Vite DERLEME anında sabitler; çalışma anında
      # vermek işe yaramaz (Dockerfile:6-10). Bu argüman olmadan üretilen imajda
      # kayıt formundaki Turnstile widget'ı HİÇ görünmez — imaj artık sunucuda
      # değil burada derlendiği için argümanı CI'ın vermesi ŞART.
      # Site anahtarı gizli değildir (HTML'e gömülür), o yüzden secret değil
      # repository variable: Settings → Secrets and variables → Actions → Variables.
      - name: Build production image
        run: |
          set -euo pipefail
          if [ -z "${{ vars.TURNSTILE_SITE_KEY }}" ]; then
            echo "::error::TURNSTILE_SITE_KEY repository variable tanımlı değil; üretilen imajda kayıt formu çalışmaz." >&2
            exit 1
          fi
          # OCI revision etiketi: sunucuya kod git ile gelmediği için
          # (docs/ops/DEPLOY.md → "Sürüm aktarımı — dizin takası")
          # deploy/sunucu-deploy.sh bu etiketi diskteki deploy/RELEASE_SHA ile
          # karşılaştırıp compose/deploy dosyalarının imajla aynı commit'ten
          # geldiğini fail-closed doğrular. Etiket düşerse o kontrol körleşir.
          # BİLİNÇLİ ATTESTATION POLİTİKASI: Bu job test ettiği tek-platform
          # imajı yerel Docker store'a export edip save/load ile yayın job'ına
          # taşır. Docker exporter/save attestation index'ini korumaz. Provenance
          # veya SBOM'u farkında olmadan düşürmemek için ikisini açıkça kapatıp
          # yayınlanan nesneyi tek image manifest olarak sabitliyoruz. Attestation
          # istenirse ayrı bir registry-direct build/push tasarımı gerekir.
          docker build --provenance=false --sbom=false --target production \
            --build-arg VITE_TURNSTILE_SITE_KEY='${{ vars.TURNSTILE_SITE_KEY }}' \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t yerel-hesap-pro:${{ github.sha }} .
      - name: Verify backup tools in production image
        run: |
          docker run --rm --entrypoint pg_dump yerel-hesap-pro:${{ github.sha }} --version
          docker run --rm --entrypoint pg_restore yerel-hesap-pro:${{ github.sha }} --version
      - name: Verify production image has no test assets
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh yerel-hesap-pro:${{ github.sha }} -c '
            set -eu
            cd /app/backend
            # Bosluklu YOK; $yollar bilerek tirnaksiz genisletilir (kelime bolme).
            yollar="tests donmus_saat.py non_twin_skip_exceptions.json"
            yollar="$yollar sandbox requirements-dev.txt"
            yollar="$yollar LEGACY_TEST_MIGRATION_PLAN.md"
            yollar="$yollar tools/capture_frontend_fixtures.py"
            kalan=""
            for yol in $yollar
            do
              if [ -e "$yol" ]; then kalan="$kalan /app/backend/$yol"; fi
            done
            if [ -n "$kalan" ]; then
              echo "Uretim imaji test varligi tasiyor:$kalan" >&2
              exit 1
            fi
            adet="$(find /app/backend -name "test_*.py" | wc -l)"
            if [ "$adet" != "0" ]; then
              echo "Uretim imajinda $adet adet test_*.py kaldi" >&2
              exit 1
            fi
          '
      # Imaj kuran kapi testi backend-quality shard'indan BURAYA tasindi:
      # shard'da iki imaj kurup 62-180 s harciyor ve 180 s timeout'a carpip
      # "0 test" ile kirmizi yanabiliyordu (run 33812772540 attempt 1, shard 0).
      # Uretim yarisi zaten YUKARIDAKI "Verify production image has no test
      # assets" adiminda, bu job'in ZATEN kurdugu imaj uzerinde olculuyor; o
      # yuzden yalniz test stage yarisi kaldi ve --target test'i kendisi kurar.
      # Bu job'da defaults working-directory YOK ve Python kurulu DEGIL; pytest.ini
      # asyncio_mode=auto istedigi icin pytest-asyncio de gerekiyor.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test stage kapisi (docker_imaj)
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest pytest-asyncio
          python -m pytest tests/test_uretim_imaji_kapisi.py -m docker_imaj -q
      # Kapi etiketi ~526 MB tutuyor; runner diskini sonraki adimlara birak.
      - name: Kapi imaj etiketini temizle
        if: always()
        run: |
          docker rmi -f yerel-hesap-test:uretim-imaji-kapisi || true
          docker rmi -f yerel-hesap-pro:uretim-imaji-kapisi || true
          docker images | grep uretim-imaji-kapisi && exit 1 || echo "temiz: kapi etiketi kalmadi"
      - name: Smoke-test non-root read-only container
        run: |
          docker network create yhp-ci
          docker run -d --name yhp-db --network yhp-ci \
            -e POSTGRES_DB=yerelhesap -e POSTGRES_USER=yerelhesap -e POSTGRES_PASSWORD=ci-only-password \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec yhp-db pg_isready -U yerelhesap -d yerelhesap && break
            sleep 2
          done
          docker run -d --name yhp-app --network yhp-ci --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e DATABASE_URL=postgresql+psycopg://yerelhesap:ci-only-password@yhp-db:5432/yerelhesap \
            -e AUTO_MIGRATE=true -e COOKIE_SECURE=false \
            yerel-hesap-pro:${{ github.sha }}
          for i in $(seq 1 60); do
            if docker exec yhp-app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/api/ready', timeout=3)"; then exit 0; fi
            sleep 2
          done
          docker logs yhp-app
          exit 1

      # Kalıcı veri hacminin KABUL testi. Duman testi yalnız /api/ready'ye bakar
      # ve hiçbir şey YAZMAZ; attachment yükleme ile yedek alma tam da bu yüzden
      # üretimde 500 verirken CI'dan geçebiliyordu. Bu adım gerçek imajla gerçek
      # bir volume bağlayıp uçtan uca yazma/okuma/kalıcılık kanıtı üretir:
      # upload+download hash eşleşmesi, platform yedeği, restart, kabın yok edilip
      # yeniden yaratılması, dolu volume ile tekrar deploy ve hash sabitliği.
      - name: Kalıcı veri hacmi kabul testi (gerçek imaj)
        run: IMAJ=yerel-hesap-pro:${{ github.sha }} ONEK=ci-vkt ./deploy/veri-kaliciligi-kabul-testi.sh

      # deploy/sunucu-deploy.sh'in iki fail-closed kapısı. Betiği source edip
      # GERÇEK fonksiyonlarını çağırır: eksik/uyuşmayan sürüm SHA'sı, etiketsiz
      # imaj, eksik/bozuk/boş kurtarma kopyası, hedefte dosya çakışması — hepsi
      # exit 1 vermeli; doğru kurtarma ise volume'da hash eşitliği üretmeli.
      - name: Sürüm sözleşmesi ve veri kurtarma kapıları (gerçek imaj)
        run: IMAJ=yerel-hesap-pro:${{ github.sha }} ./deploy/surum-ve-kurtarma-testi.sh

      # İmaj ile compose'un sözleşmesi: deploy/sunucu-deploy.sh üretimde bu iki
      # kontrolü fail-closed yapıyor. Aynı kontrolü burada da koşturmak, sözleşmeyi
      # bozan bir değişikliğin sunucuya kadar gitmesini engeller.
      - name: İmaj ↔ compose sözleşmesi
        run: |
          set -euo pipefail
          sahip="$(docker run --rm --entrypoint stat yerel-hesap-pro:${{ github.sha }} -c '%u:%g' /opt/sungur-data)"
          [ "$sahip" = "10001:10001" ] || { echo "::error::imajda /opt/sungur-data sahibi $sahip, beklenen 10001:10001" >&2; exit 1; }
          revizyon="$(docker image inspect yerel-hesap-pro:${{ github.sha }} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [ "$revizyon" = "${{ github.sha }}" ] || { echo "::error::OCI revision etiketi eksik/yanlış: $revizyon" >&2; exit 1; }
          cp .env.production.example .env.ci-dogrulama
          cat >> .env.ci-dogrulama <<'EOF'
          POSTGRES_PASSWORD=ci-only-password-yeterince-uzun
          TURNSTILE_SECRET_KEY=ci-dummy
          BOOTSTRAP_ADMIN_PASSWORD=ci-dummy-bootstrap-pw
          EOF
          cozum="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.ci-dogrulama config)"
          echo "$cozum" | grep -q 'SUNGUR_DATA_DIR: /opt/sungur-data' || { echo "::error::compose SUNGUR_DATA_DIR geçirmiyor" >&2; exit 1; }
          echo "$cozum" | grep -q 'source: sungur_data'               || { echo "::error::compose sungur_data mount etmiyor" >&2; exit 1; }
          echo "$cozum" | grep -q 'read_only: true'                   || { echo "::error::compose read_only:true kaybolmuş" >&2; exit 1; }
          # Kanonik depo. CI imajı `ghcr.io/${{ github.repository }}`'ye
          # yayınlıyor; compose başka bir depodan çekerse deploy ya hiç imaj
          # bulamaz ya da eski paketten BAYAT bir imaj çeker. Bu sapma bir kez
          # gerçekleşti ve hiçbir kapı görmedi — artık burada fail-closed.
          #
          # METİN GREP'İ DEĞİL, JSON ALAN KARŞILAŞTIRMASI. `grep "image: ..."`
          # çözümlenmiş YAML'ın HERHANGİ bir yerinde eşleşir; `app` servisine
          # ait olduğunu doğrulamaz. Bir yorum satırı ya da başka bir servis
          # kapıyı yeşil tutabilirdi. Alan yolu tek anlamlıdır.
          kanonik="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          # Etiket BU ADIMDA sabitlenir. Aksi hâlde beklenti compose'un
          # `${APP_IMAGE_TAG:-develop}` varsayılanıyla kabuğun kendi
          # varsayılanının TESADÜFEN uyuşmasına yaslanırdı; biri değişince kapı
          # sessizce anlamsızlaşır. Ayrıca etiket yerine koymanın gerçekten
          # çalıştığını da kanıtlar.
          dogrulama_etiketi="ci-kapi-etiketi"
          echo "APP_IMAGE_TAG=$dogrulama_etiketi" >> .env.ci-dogrulama
          cozum_json="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.ci-dogrulama config --format json)"
          app_imaj="$(jq -r '.services.app.image // empty' <<<"$cozum_json")"
          beklenen_imaj="${kanonik}:${dogrulama_etiketi}"
          [ "$app_imaj" = "$beklenen_imaj" ] \
            || { echo "::error::resolved app.image ile CI yayın hedefi eşit değil: '$app_imaj' != '$beklenen_imaj'" >&2; exit 1; }
          # Üretimde derleme geri düşüşü kapalı olmalı: `pull` hata verdiğinde
          # Compose yerelde DERLEMEYE düşmemeli (bkz. docker-compose.prod.yml,
          # `build: !reset null`).
          app_build="$(jq -r '.services.app | has("build")' <<<"$cozum_json")"
          [ "$app_build" = "false" ] \
            || { echo "::error::resolved app.build hâlâ var; üretim derlemesi yalnız CI'da yapılmalı" >&2; exit 1; }
          echo "resolved app.image = $app_imaj (build yok) ✓"
          rm -f .env.ci-dogrulama
          echo "imaj ↔ compose sözleşmesi tamam"

      # Deploy sözleşmesinin geri kalanı: kanonik depo, üretimde derleme
      # geri düşüşünün kapalı olması, koşuya özel geçici manifest izolasyonu,
      # bilinmeyen mount'ta fail-closed duruş ve yarım kalmış tohumlamanın
      # silmeden/üzerine yazmadan reddi. Negatif mutasyonlarıyla birlikte.
      - name: Install CI workflow YAML parser
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ci-contract-venv"
          "$RUNNER_TEMP/ci-contract-venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
          echo "$RUNNER_TEMP/ci-contract-venv/bin" >> "$GITHUB_PATH"
      - name: Üretim deploy sözleşmesi (mount, manifest izolasyonu, tohumlama)
        run: ./deploy/deploy-sozlesme-testi.sh

      # Ayrı runner'daki publish-image job'ı yerel Docker daemon'ını devralamaz.
      # Yalnız develop push'unda, bütün container kapılarından geçen TAM imajı
      # artifact olarak aktar; yeniden derleyip test edilmemiş bir imaj yayınlama.
      - name: Package tested production image
        id: paketle
        run: |
          set -euo pipefail
          # Kaydedilmek ÜZERE olan imajın kimliği: `docker save`in girdisiyle
          # AYNI nesneden okunur. verify-image-artifact yüklediği imajın
          # kimliğini buna karşı ölçer.
          tested_image_id="$(docker image inspect yerel-hesap-pro:${{ github.sha }} --format '{{.Id}}')"
          [ -n "$tested_image_id" ] || { echo "::error::test edilen imaj ID'si okunamadı" >&2; exit 1; }
          echo "tested_image_id=$tested_image_id" >> "$GITHUB_OUTPUT"
          docker save yerel-hesap-pro:${{ github.sha }} \
            | gzip -1 > "$RUNNER_TEMP/tested-production-image.tar.gz"
      - name: Upload tested production image
        uses: actions/upload-artifact@v4
        with:
          name: tested-production-image-${{ github.sha }}
          path: ${{ runner.temp }}/tested-production-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  # PR dahil her koşuda container'ın test ettiği TAM artifact ayrı runner'da
  # gerçekten yüklenir. Bu job paket yazamaz; fork PR'larında da GHCR yetkisi
  # açmadan SHA etiketi ile OCI revision sözleşmesini davranışsal olarak ölçer.
  verify-image-artifact:
    needs: [container]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      # Kapı artık ayrı bir betiktir; iş, ağacı checkout etmeden onu çağıramaz.
      - uses: actions/checkout@v4
      - name: Download tested production image
        uses: actions/download-artifact@v4
        with:
          name: tested-production-image-${{ github.sha }}
          path: ${{ runner.temp }}/tested-production-image
          if-no-files-found: error
      - name: Load tested production image
        run: gzip -dc "$RUNNER_TEMP/tested-production-image/tested-production-image.tar.gz" | docker load
      # Bu adım KAPI MANTIĞINI İÇERMEZ; yalnızca onu ÇAĞIRIR. Mantık
      # `deploy/artifact-imaj-kimlik-kapisi.sh` dosyasındadır (K5).
      - name: Verify loaded image identity and OCI revision
        env:
          IMAJ_REF: yerel-hesap-pro:${{ github.sha }}
          BEKLENEN_IMAJ_KIMLIGI: ${{ needs.container.outputs.tested_image_id }}
          BEKLENEN_OCI_REVIZYONU: ${{ github.sha }}
        run: ./deploy/artifact-imaj-kimlik-kapisi.sh

  # Yayın işi test runner'larından yerel durum devralmaz. `container`ın ürettiği
  # ve doğruladığı imaj artifact'ını ancak bütün zorunlu test işleri geçtikten
  # sonra yükler; PR'larda job bütünüyle atlanır ve paket yazma yetkisi açılmaz.
  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [alembic-chain, durum-kaydi, backend-quality-canonical, backend-quality, backend-quality-aggregate, backend-postgresql, frontend, contract-drift, e2e, container, verify-image-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Yalnız imaj yayınlamak için; başka hiçbir yazma yetkisi verilmiyor.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested production image
        uses: actions/download-artifact@v4
        with:
          name: tested-production-image-${{ github.sha }}
          path: ${{ runner.temp }}/tested-production-image
      - name: Load tested production image
        run: gzip -dc "$RUNNER_TEMP/tested-production-image/tested-production-image.tar.gz" | docker load

      # --- İmajı yayınla ---------------------------------------------------
      # Neden: imaj eskiden PROD SUNUCUSUNDA derleniyordu. 1 GB'lik kutuda Vite
      # derlemesi belleği yiyor, dockerd her derlemede şişiyordu; 2026-08-05'te
      # bu birikim makineyi takasa düşürdü ve site 15 sn'lik zaman aşımlarına
      # girdi. Derleme artık burada yapılır, sunucu yalnız hazır imajı indirir.
      #
      # YALNIZ develop'a push'ta ve duman testi GEÇTİKTEN SONRA yayınlanır:
      # PR'lar paket yazamaz, çalışmayan imaj asla yayına çıkamaz.
      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          # İki etiket: 'develop' hareketli (son sürüm), SHA değişmez (geri dönüş
          # için tek güvenilir referans — 'develop' bir sonraki merge'de kayar).
          docker tag yerel-hesap-pro:${{ github.sha }} "ghcr.io/$repo:develop"
          docker tag yerel-hesap-pro:${{ github.sha }} "ghcr.io/$repo:${{ github.sha }}"
          docker push "ghcr.io/$repo:develop"
          docker push "ghcr.io/$repo:${{ github.sha }}"
          echo "Yayınlandı: ghcr.io/$repo:${{ github.sha }}"

