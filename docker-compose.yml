services:
  app:
    build:
      context: .
      args:
        # Public Turnstile site key inlined into the frontend bundle at build
        # time (Vite VITE_*). Same value the backend uses for verification.
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    init: true
    ports:
      - "5050:5050"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env.docker}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5050,http://127.0.0.1:5050}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yerelhesap}
      POSTGRES_USER: ${POSTGRES_USER:-yerelhesap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yerelhesap} -d ${POSTGRES_DB:-yerelhesap}"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s
    restart: unless-stopped
volumes:
  postgres_data:
